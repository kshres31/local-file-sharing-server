[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="lan-drop"
version="0.1.0"
description="A small local-network file sharing server"
requires-python=">=3.10"
[project.scripts]
lan-drop="lan_drop.server:main"
[tool.setuptools.packages.find]
where=["src"]

